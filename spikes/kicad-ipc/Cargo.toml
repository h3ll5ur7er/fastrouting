# A throwaway prototype for TRX-17, outside the workspace so it never enters a release build.
[package]
name = "traxide-kicad-ipc-spike"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
anyhow = "1"
prost = "0.14"
