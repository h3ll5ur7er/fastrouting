name: Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "corpus/**"
      - "crates/**"
      - "e2e/**"
      - "xtask/**"
      - ".github/workflows/bench.yml"

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: traxide and Freerouting, judged by KiCad 10
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      # Freerouting runs as a black box; its source is never read (docs/Development.md, clean-room rules).
      - name: Download Freerouting 2.5.0
        run: |
          gh release download v2.5.0 --repo freerouting/freerouting --pattern '*.jar' --dir freerouting
          ls -l freerouting
        env:
          GH_TOKEN: ${{ github.token }}
      - run: docker pull kicad/kicad:10.0
      - name: Route and judge
        run: |
          jar=$(ls freerouting/*.jar | head -n 1)
          cargo xtask bench --freerouting "java -jar $jar" --timeout 3600 matrix-6x17 keyboard-tkl
      # The sessions, KiCad's DRC reports and the routed boards, to look into what the table counts.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: |
            target/bench/**/*.ses
            target/bench/**/*.json
            target/bench/**/*.kicad_pcb
            target/bench/**/*.kicad_pro
          if-no-files-found: ignore

  corpus:
    name: Real boards, traxide and Freerouting (shard ${{ matrix.shard }} of 6)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      # Freerouting runs as a black box; its source is never read (docs/Development.md, clean-room rules).
      - name: Download Freerouting 2.5.0
        run: gh release download v2.5.0 --repo freerouting/freerouting --pattern '*.jar' --dir freerouting
        env:
          GH_TOKEN: ${{ github.token }}
      # Boards from Freerouting's bug reports (corpus/freerouting-fixtures.txt) and KiCad
      # projects (corpus/kicad-projects.txt), downloaded at run time. KiCad, in its Docker
      # image, exports a project's DSN for Freerouting and imports Freerouting's session.
      - name: Route and judge
        run: |
          jar=$(ls freerouting/*.jar | head -n 1)
          cargo xtask corpus --timeout 120 --freerouting "java -jar $jar" --shard ${{ matrix.shard }}/6
      # Both routers' sessions, to see what each wrote where the table surprises.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-sessions-${{ matrix.shard }}
          path: |
            target/corpus/routed/
            target/corpus/projects/*/traxide.*
            target/corpus/projects/*/freerouting.*
          if-no-files-found: ignore
      # traxide's results, for the gate below.
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-results-${{ matrix.shard }}
          path: target/corpus/results-*.json

  gate:
    name: Corpus gate, against corpus/baseline.json
    needs: corpus
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: corpus-results-*
          path: results
          merge-multiple: true
      # Fails on a regression; a shard that failed leaves its boards missing, which fails too.
      - name: Compare with the baseline
        run: cargo xtask gate --merged target/corpus-results.json results/*.json
      # All shards' results in one file: copied to corpus/baseline.json, it raises the baseline.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: corpus-results
          path: target/corpus-results.json
          if-no-files-found: ignore
