name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo xtask layers

  licences:
    name: Permissive licences only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  kicad:
    name: Round trip through KiCad ${{ matrix.kicad }}
    strategy:
      fail-fast: false
      matrix:
        kicad: ["10.0", "9.0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The plugin test runs traxide inside KiCad's image: a static build runs on its C library.
      - run: rustup target add x86_64-unknown-linux-musl
      - run: docker pull kicad/kicad:${{ matrix.kicad }}
      - run: cargo xtask e2e
        env:
          TRAXIDE_KICAD_IMAGE: kicad/kicad:${{ matrix.kicad }}
